[project]
name = "agent-action-guard"
version = "0.1.0"
description = "A guard between an LLM agent and its tools, evaluated against prompt injection on AgentDojo"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agentdojo==0.1.35",
    "openai>=3.24.0",
    "python-dotenv>=1.2.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
